<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times07 News - Global Coverage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: #0f172a; color: #fff; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .category-container { max-width: 1280px; margin: 20px auto; padding: 0 15px; }
        .cat-header { background: #090d16; border-bottom: 3px solid #c00000; padding: 12px 3%; display: flex; justify-content: space-between; align-items: center; }
        .abp-badge { background: #c00000; color: #fff; padding: 4px 10px; font-weight: 800; border-radius: 4px; font-size: 22px; }
        .times-brand { font-size: 26px; font-weight: 800; color: #fff; }
        
        .section-block { margin-bottom: 35px; }
        .section-title-global { font-size: 20px; font-weight: 800; color: #fff; border-left: 5px solid #c00000; padding-left: 12px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Fixed 6-Card Compact Grid Layout */
        .compact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-card-item { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.2s; }
        .grid-card-item:hover { transform: translateY(-3px); border-color: #c00000; }
        .grid-card-item img { width: 100%; height: 150px; object-fit: cover; }
        .grid-card-body { padding: 12px; }
        .grid-card-body h4 { font-size: 13px; font-weight: 700; color: #f8fafc; line-height: 1.4; margin: 6px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .cat-badge-sm { background: #c00000; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }

        @media(max-width: 900px) { .compact-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 600px) { .compact-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="cat-header">
        <a href="index.html" style="text-decoration:none;">
            <span class="abp-badge">Times</span><span class="times-brand">07</span>
        </a>
        <a href="index.html" style="color: #fde047; font-weight: 800; text-decoration: none; font-size: 13px;"><i class="fa-solid fa-house"></i> HOME</a>
    </header>

    <div class="category-container">
        <div style="border-bottom: 2px solid #c00000; padding-bottom: 10px; margin-bottom: 25px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <p style="color: #94a3b8; font-size: 12px; margin: 0; font-weight: 700;">CATEGORY COVERAGE</p>
                <h1 id="cat-page-title" style="font-size: 26px; font-weight: 800; margin: 4px 0 0; text-transform: uppercase; color: #fff;">
                    LOADING CATEGORY...
                </h1>
            </div>
            <span style="background: #c00000; color:#fff; font-weight:800; padding:4px 10px; border-radius:4px; font-size:11px;">6 TOP STORIES</span>
        </div>

        <!-- Section 1: Main Category (Max 6 News) -->
        <div class="section-block">
            <h2 class="section-title-global" id="main-section-heading">TOP HEADLINES</h2>
            <div class="compact-grid" id="main-category-grid"></div>
        </div>

        <!-- Section 2: Related Category 1 (Max 6 News) -->
        <div class="section-block">
            <h2 class="section-title-global">MARKETS & BUSINESS</h2>
            <div class="compact-grid" id="markets-category-grid"></div>
        </div>

        <!-- Section 3: Related Category 2 (Max 6 News) -->
        <div class="section-block">
            <h2 class="section-title-global">TECH & INNOVATION</h2>
            <div class="compact-grid" id="tech-category-grid"></div>
        </div>
    </div>

    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const selectedCat = urlParams.get('cat') || 'Global Markets';
        
        document.getElementById('cat-page-title').innerText = selectedCat + ' NEWS';
        document.getElementById('main-section-heading').innerText = selectedCat + ' HIGHLIGHTS';
        
        const allNews = JSON.parse(localStorage.getItem('times07_news')) || [];

        // Helper to Render Exactly 6 Cards
        function render6Cards(containerId, newsItems) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            
            const displayList = newsItems.length > 0 ? newsItems.slice(0, 6) : allNews.slice(0, 6);

            displayList.forEach(news => {
                const index = allNews.indexOf(news);
                const card = document.createElement('div');
                card.className = 'grid-card-item';
                card.innerHTML = `
                    <a href="article.html?id=${index}" style="text-decoration:none;">
                        <img src="${news.img1 || news.image || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500'}" loading="lazy">
                        <div class="grid-card-body">
                            <span class="cat-badge-sm">${news.category || selectedCat}</span>
                            <h4>${news.title}</h4>
                        </div>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // 1. Selected Category News (6 Items)
        const selectedCatNews = allNews.filter(item => {
            const cat = (item.category || '').toLowerCase();
            const title = (item.title || '').toLowerCase();
            return cat.includes(selectedCat.toLowerCase()) || title.includes(selectedCat.toLowerCase());
        });
        render6Cards('main-category-grid', selectedCatNews);

        // 2. Markets & Business Block (6 Items)
        const marketNews = allNews.filter(x => (x.category || '').toLowerCase().includes('market') || (x.category || '').includes('बिजनेस'));
        render6Cards('markets-category-grid', marketNews);

        // 3. Tech & AI Block (6 Items)
        const techNews = allNews.filter(x => (x.category || '').toLowerCase().includes('tech') || (x.category || '').includes('टेक'));
        render6Cards('tech-category-grid', techNews);
    </script>
</body>
</html>
