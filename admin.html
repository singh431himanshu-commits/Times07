 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times07 - Admin Control Desk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #c00000;
            --accent-blue: #2563eb;
            --accent-green: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Security PIN Gate */
        #security-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19; z-index: 99999; display: flex; align-items: center; justify-content: center;
        }
        .gate-card {
            background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px;
            width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .icon-3d {
            width: 55px; height: 50px; margin: 0 auto 15px;
            background: linear-gradient(145deg, #c00000, #8b0000);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #fff; box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
        }

        /* Sidebar & Main */
        .admin-sidebar { width: 260px; background: var(--panel-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .brand-header { padding: 20px; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; color: var(--accent-red); }
        .nav-menu { list-style: none; padding: 15px 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; font-size: 13px; font-weight: 700; color: var(--text-muted); border-radius: 6px; cursor: pointer; margin-bottom: 4px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--accent-red); color: #fff; }

        .admin-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .admin-header { height: 60px; background: var(--panel-dark); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .admin-body { flex: 1; padding: 25px; overflow-y: auto; }

        .panel-card { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; }
        .btn { padding: 9px 18px; font-size: 13px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-blue { background: var(--accent-blue); color: #fff; }

        .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .table th { background: #0f172a; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <div class="brand-header">
            <i class="fa-solid fa-user-shield"></i> Times07 Desk
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="showTab('add-news')"><i class="fa-solid fa-pen-to-square"></i> नई खबर जोड़ें</li>
            <li class="nav-item" onclick="showTab('manage-news')"><i class="fa-solid fa-list-check"></i> खबर मैनेज करें</li>
        </ul>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h4>Times07 Enterprise Dashboard</h4>
            <a href="index.html" class="btn btn-blue" style="text-decoration:none;"><i class="fa-solid fa-globe"></i> लाइव वेबसाइट देखें</a>
        </header>

        <div class="admin-body">
            <!-- ADD/EDIT FORM -->
            <div id="tab-add-news" class="panel-card">
                <button class="btn btn-blue" onclick="fetchInstantAutoNews()" style="margin-bottom:15px;">
    <i class="fa-solid fa-bolt"></i> 1-Click ऑटो ट्रेंडिंग खबरें लाएं
</button>
                <h3 id="form-title" style="margin-bottom:15px;">✍️ Publish New Article</h3>
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label>खबर का शीर्षक (Title)</label>
                    <input type="text" id="news-title" class="form-control" placeholder="यहाँ हेडिंग टाइप करें...">
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="form-group">
                        <label>कैटेगरी (Category)</label>
                        <select id="news-cat" class="form-control">
                            <option>मुख्य समाचार</option>
                            <option>राजनीति</option>
                            <option>बिजनेस</option>
                            <option>खेल</option>
                            <option>टेक & AI</option>
                            <option>मनोरंजन</option>
                            <option>राज्य</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>फोटो चुनिए (PC से अपलोड करें या Link डालें)</label>
                        <input type="file" id="news-img-file" class="form-control" accept="image/*" onchange="uploadPCImage(this)">
                        <input type="text" id="news-img" class="form-control" placeholder="या फोटो का URL डालें..." style="margin-top:6px;">
                    </div>
                </div>

                <div class="form-group">
                    <label>पूरी खबर विवरण (Description)</label>
                    <textarea id="news-desc" class="form-control" rows="6" placeholder="पूरी खबर यहाँ लिखें..."></textarea>
                </div>

                <button class="btn btn-red" onclick="publishNews()"><i class="fa-solid fa-paper-plane"></i> वेबसाइट पर पब्लिश करें</button>
            </div>

            <!-- MANAGE TABLE -->
            <div id="tab-manage-news" class="panel-card" style="display:none;">
                <h3>📰 पब्लिश की गई खबरें</h3>
                <table class="table">
                    <thead>
                        <tr><th>शीर्षक</th><th>कैटेगरी</th><th>एक्शन</th></tr>
                    </thead>
                    <tbody id="articles-list-table"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function unlockDesk() {
            const pin = document.getElementById('admin-pin').value;
            if (pin === '1234' || pin === 'admin') {
                document.getElementById('security-gate').style.display = 'none';
            } else {
                alert('गलत पिन! सही पिन 1234 है।');
            }
        }

        function uploadPCImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('news-img').value = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0c_Bz7HdU6YoL62L1cGfsA89Hg7609Ww",
            authDomain: "times07news.firebaseapp.com",
            projectId: "times07news",
            storageBucket: "times07news.firebasestorage.app",
            messagingSenderId: "527951679601",
            appId: "1:527951679601:web:d33bfb58aaae9665c68bd0",
            databaseURL: "https://times07news-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const newsRef = ref(db, 'articles');

        window.showTab = function(tabName) {
            document.querySelectorAll('.panel-card').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tabName).style.display = 'block';
        };
        window.fetchInstantAutoNews = async function() {
    alert("ताज़ा ऑटो-न्यूज़ लोड हो रही है, कृपया 2 सेकंड रुकें...");
    try {
        // Direct Proxy RSS Fetch
        const rssUrl = 'https://zeenews.india.com/rss/india-national-news.xml';
        const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`;
        
        const res = await fetch(proxyUrl);
        const xmlText = await res.text();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        if (items && items.length > 0) {
            let count = 0;
            items.forEach((item, index) => {
                if (index < 5) {
                    const title = item.querySelector("title")?.textContent || "";
                    let desc = item.querySelector("description")?.textContent || title;
                    desc = desc.replace(/<[^>]*>?/gm, '').substring(0, 150) + '...';

                    if (title) {
                        push(newsRef, {
                            title: title,
                            category: 'ब्रेकिंग न्यूज़',
                            img1: 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800',
                            desc: desc,
                            views: Math.floor(Math.random() * 2000) + 500,
                            timestamp: Date.now()
                        });
                        count++;
                    }
                }
            });

            if (count > 0) {
                alert(`सफलता! ${count} नई ताज़ा खबरें सीधे Firebase डेटाबेस पर पब्लिश हो गईं!`);
            } else {
                alert("खबरें पढ़ने में समस्या आई।");
            }
        } else {
            alert("RSS सर्वर से प्रतिक्रिया नहीं मिली।");
        }
    } catch (err) {
        alert("त्रुटि: " + err.message);
    }
};
 

        window.publishNews = function() {
            const title = document.getElementById('news-title').value;
            const cat = document.getElementById('news-cat').value;
            const img = document.getElementById('news-img').value || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800';
            const desc = document.getElementById('news-desc').value;
            const editId = document.getElementById('edit-id').value;

            if(!title) return alert("कृपया हेडिंग दर्ज करें!");

            if(editId) {
                update(ref(db, 'articles/' + editId), { title, category: cat, img1: img, desc });
                alert("खबर अपडेट हो गई!");
                document.getElementById('edit-id').value = "";
            } else {
                push(newsRef, { title, category: cat, img1: img, desc, views: Math.floor(Math.random()*2000)+500, timestamp: Date.now() });
                alert("खबर पब्लिश हो गई!");
            }

            document.getElementById('news-title').value = "";
            document.getElementById('news-desc').value = "";
            document.getElementById('news-img').value = "";
            showTab('manage-news');
        };

        onValue(newsRef, (snapshot) => {
            const data = snapshot.val();
            const table = document.getElementById('articles-list-table');
            table.innerHTML = "";
            if(data) {
                Object.keys(data).forEach(key => {
                    const news = data[key];
                    table.innerHTML += `
                        <tr>
                            <td><strong>${news.title}</strong></td>
                            <td>${news.category || 'सामान्य'}</td>
                            <td>
                                <button class="btn btn-blue" onclick="editNews('${key}', '${encodeURIComponent(news.title)}', '${news.category}', '${news.img1}', '${encodeURIComponent(news.desc||'')}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-red" onclick="deleteNews('${key}')"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
        });

        window.editNews = function(id, title, cat, img, desc) {
            showTab('add-news');
            document.getElementById('edit-id').value = id;
            document.getElementById('news-title').value = decodeURIComponent(title);
            document.getElementById('news-cat').value = cat;
            document.getElementById('news-img').value = img;
            document.getElementById('news-desc').value = decodeURIComponent(desc);
            document.getElementById('form-title').innerText = "✏️ Edit Article";
        };

        window.deleteNews = function(id) {
            if(confirm("क्या आप इस खबर को हटाना चाहते हैं?")) {
                remove(ref(db, 'articles/' + id));
            }
        };
    </script>
    <!-- Modern AURA-07 AI Control Panel -->
<div id="aura-admin-chat" style="background: #18191c; border-left: 1px solid #2d2f36; height: 100vh; display: flex; flex-direction: column; color: #e1e3e6; font-family: sans-serif;">
  
  <!-- Header -->
  <div style="padding: 15px; background: #202225; border-bottom: 1px solid #2d2f36; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 20px;">🤖</span>
      <div>
        <h4 style="margin: 0; font-size: 15px; color: #fff;">AURA-07 (Maxi)</h4>
        <small style="color: #00ffcc; font-size: 11px;">● Online | AI Admin</small>
      </div>
    </div>
  </div>

  <!-- Chat Log Area -->
  <div id="chat-logs" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #121315;">
    <!-- History will load here dynamically -->
  </div>

  <!-- Input Area -->
  <div style="padding: 12px; background: #202225; border-top: 1px solid #2d2f36; display: flex; gap: 8px;">
    <input type="text" id="admin-input" placeholder="यहाँ कमांड टाइप करें... (Enter दबाएं)" style="flex: 1; padding: 10px 14px; background: #2f3136; border: 1px solid #40444b; color: #fff; border-radius: 6px; outline: none; font-size: 14px;">
     <button onclick="sendAuraCmd()" id="send-btn" type="button" style="padding: 10px 16px; background: #ff4757; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">Send</button>

</div>
<script>
async function loadChatHistory() {
  const chatLogs = document.getElementById('chat-logs');
  if (!chatLogs) return;

  try {
    const res = await fetch('http://127.0.0.1:5000/api/chat_history');
    const history = await res.json();
    chatLogs.innerHTML = '';

    if (history.length === 0) {
      chatLogs.innerHTML = `<div style="background: #202225; padding: 10px 14px; border-radius: 8px; color: #00ffcc; max-width: 85%; font-size: 13px;"><b>Maxi:</b> जी बॉस! मैं तैयार हूँ। हुक्म कीजिए।</div>`;
    } else {
      history.forEach(item => {
        appendUserMessage(item.user);
        appendAiMessage(item.ai);
      });
    }
    chatLogs.scrollTop = chatLogs.scrollHeight;
  } catch (err) {
    chatLogs.innerHTML = `<div style="color: #ff4757; font-size: 12px; background: #202225; padding: 8px; border-radius: 6px;">⚠️ Server Offline. Terminal में python aura.py चलाएं!</div>`;
  }
}

function appendUserMessage(msg) {
  const chatLogs = document.getElementById('chat-logs');
  const div = document.createElement('div');
  div.style.cssText = "align-self: flex-end; background: #2f3542; color: #fff; padding: 9px 13px; border-radius: 12px 12px 0px 12px; max-width: 80%; font-size: 13px; word-break: break-word;";
  div.innerHTML = `<b>You:</b> ${msg}`;
  chatLogs.appendChild(div);
  chatLogs.scrollTop = chatLogs.scrollHeight;
}

function appendAiMessage(msg) {
  const chatLogs = document.getElementById('chat-logs');
  const div = document.createElement('div');
  div.style.cssText = "align-self: flex-start; background: #1e272e; color: #00d2d3; padding: 9px 13px; border-radius: 12px 12px 12px 0px; max-width: 80%; font-size: 13px; border-left: 3px solid #00d2d3; word-break: break-word;";
  div.innerHTML = `<b>Maxi:</b> ${msg}`;
  chatLogs.appendChild(div);
  chatLogs.scrollTop = chatLogs.scrollHeight;
}

async function sendAuraCmd() {
  const adminInput = document.getElementById('admin-input');
  const msg = adminInput.value.trim();
  if (!msg) return;

  appendUserMessage(msg);
  adminInput.value = '';

  try {
    const res = await fetch('http://127.0.0.1:5000/api/admin_chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    appendAiMessage(data.reply);
  } catch (err) {
    appendAiMessage("सर्वर से कनेक्शन नहीं हो पाया बॉस! क्या python aura.py चल रहा है?");
  }
}

// Enter key binding with e.preventDefault() to stop page reload
window.onload = function() {
  loadChatHistory();
  const input = document.getElementById('admin-input');
  if (input) {
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault(); // इससे पेज रीलोड/पासवर्ड मांगना बंद हो जाएगा
        sendAuraCmd();
      }
    });
  }
};
</script>
</body>
</html>
